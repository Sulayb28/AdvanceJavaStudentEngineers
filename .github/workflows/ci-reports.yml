name: CI Reports

on:
  push:
  pull_request:

jobs:
  ci-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies (fallback)
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Run full build & static analysis but don't fail pipeline on style violations
      - name: Build, Test & Analysis
        run: ./mvnw -B clean verify -Dmaven.test.failure.ignore=false -Dcheckstyle.failsOnError=false -Dpmd.failOnViolation=false
        continue-on-error: true

      # Generate site reports (HTML for PMD, JaCoCo) without re-running tests
      - name: Generate HTML site reports
        run: ./mvnw -B -DskipTests site jacoco:report
        continue-on-error: true

      - name: Install wkhtmltopdf (provides wkhtmltoimage)
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Make script executable
        run: chmod +x scripts/html_to_png.sh

      - name: Convert HTML reports to PNG
        if: always()
        run: bash scripts/html_to_png.sh || echo 'PNG conversion failed; continuing'

      - name: Upload CI reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: |
            reports/*
            target/site/jacoco/*
            target/site/pmd*.html